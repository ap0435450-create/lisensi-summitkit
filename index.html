<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMITKIT LISENSI STUDIO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #cccccc;
            font-family: 'Courier New', monospace;
            padding: 0;
            line-height: 1.4;
            min-height: 100vh;
        }

        .logout-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 15px;
            background-color: #000000;
            border: 1px solid #ff3333;
            color: #ff3333;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            text-transform: uppercase;
            transition: all 0.2s;
            z-index: 1000;
        }

        .logout-btn:hover {
            background-color: #ff3333;
            color: #000000;
        }

        .header {
            background-color: #000000;
            border-bottom: 2px solid #ffffff;
            padding: 30px 20px;
            text-align: center;
            margin-top: 50px;
        }

        .header h1 {
            font-size: 24px;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: normal;
            text-transform: uppercase;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            border: 1px solid #ffffff;
            background-color: #000000;
            color: #ffffff;
            padding: 8px 14px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            min-width: 85px;
        }

        .nav-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .nav-btn.active {
            background-color: #ffffff;
            color: #000000;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .content-box {
            border: 2px solid #ffffff;
            padding: 25px;
            background-color: #0a0a0a;
            margin-bottom: 40px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .input-group input,
        .input-group textarea {
            flex: 1;
            min-width: 140px;
            padding: 8px;
            background-color: #000000;
            border: 1px solid #333333;
            color: #cccccc;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: #ffffff;
            color: #ffffff;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        .btn-primary {
            padding: 8px 16px;
            background-color: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            min-width: 110px;
        }

        .btn-primary:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .id-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .id-item {
            padding: 10px;
            margin-bottom: 6px;
            background-color: #000000;
            border: 1px solid #222222;
            border-left: 2px solid #555555;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            transition: all 0.2s;
        }

        .id-item:hover {
            border-left-color: #ffffff;
            border-color: #444444;
        }

        .id-info {
            flex: 1;
            min-width: 0;
        }

        .id-number {
            font-size: 12px;
            color: #888888;
            margin-bottom: 2px;
            word-break: break-all;
        }

        .id-meta {
            font-size: 9px;
            color: #555555;
        }

        .id-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .status-btn {
            padding: 4px 8px;
            background-color: #000000;
            border: 1px solid #666666;
            color: #888888;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .status-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        .status-btn.accepted {
            border-color: #ffffff;
            color: #ffffff;
            background-color: #0a0a0a;
        }

        .delete-btn {
            padding: 4px 8px;
            background-color: #000000;
            border: 1px solid #555555;
            color: #ff6666;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .delete-btn:hover {
            background-color: #ff3333;
            border-color: #ff3333;
            color: #000000;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .stat-card {
            background-color: #000000;
            border: 1px solid #222222;
            padding: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 9px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .no-data {
            text-align: center;
            padding: 25px 10px;
            color: #555555;
            font-size: 11px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .export-btn,
        .import-btn {
            padding: 8px 12px;
            background-color: #000000;
            border: 1px solid #666666;
            color: #888888;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            flex: 1;
            min-width: 100px;
        }

        .export-btn:hover,
        .import-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        #importFile {
            display: none;
        }

        .id-list::-webkit-scrollbar {
            width: 6px;
        }

        .id-list::-webkit-scrollbar-track {
            background: #000000;
        }

        .id-list::-webkit-scrollbar-thumb {
            background: #333333;
        }

        .id-list::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 16px;
                margin-bottom: 15px;
            }

            .nav-buttons {
                gap: 8px;
            }

            .nav-btn {
                padding: 6px 10px;
                font-size: 9px;
                min-width: 70px;
            }

            .content-box {
                padding: 15px;
            }

            .id-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .id-actions {
                width: 100%;
                margin-left: 0;
                margin-top: 8px;
            }

            .logout-btn {
                position: static;
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <button class="logout-btn" onclick="logoutSession()">LOGOUT</button>

    <div class="header">
        <h1>SUMMITKIT LISENSI STUDIO</h1>
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="showSection('tambah')">TAMBAH</button>
            <button class="nav-btn" onclick="showSection('acc-list')">TER-ACC</button>
            <button class="nav-btn" onclick="showSection('log')">LOG</button>
            <button class="nav-btn" onclick="showSection('blacklist')">BLACKLIST</button>
        </div>
    </div>

    <div class="container">
        <!-- TAMBAH SECTION -->
        <div id="tambah" class="section active">
            <div class="content-box">
                <div class="section-title">Tambah ID Baru</div>
                
                <div class="input-group">
                    <input type="text" id="newId" placeholder="ID (Contoh: 8740222595598)">
                </div>

                <div class="input-group">
                    <input type="text" id="newOwner" placeholder="Nama Pemilik (Optional)">
                </div>

                <div class="input-group">
                    <textarea id="newNotes" placeholder="Catatan (Optional)"></textarea>
                </div>

                <button class="btn-primary" onclick="addNewId()">Tambah ID</button>

                <div class="button-group">
                    <button class="export-btn" onclick="exportData()">Export Data</button>
                    <button class="import-btn" onclick="document.getElementById('importFile').click()">Import Data</button>
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)">
                </div>
            </div>
        </div>

        <!-- TER-ACC SECTION -->
        <div id="acc-list" class="section">
            <div class="content-box">
                <div class="section-title">List ID Yang Dizinkan (Accepted)</div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalAcc">0</div>
                        <div class="stat-label">Total ID</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="acceptedCount">0</div>
                        <div class="stat-label">Diterima</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="bannedCount">0</div>
                        <div class="stat-label">Dicabut</div>
                    </div>
                </div>

                <div class="id-list" id="accList">
                    <div class="no-data">Belum ada ID. Tambahkan di menu TAMBAH.</div>
                </div>
            </div>
        </div>

        <!-- LOG SECTION -->
        <div id="log" class="section">
            <div class="content-box">
                <div class="section-title">Log Pencuri / Akses Tidak Sah</div>
                
                <div class="input-group">
                    <input type="text" id="suspectId" placeholder="ID Tersangka">
                </div>

                <div class="input-group">
                    <textarea id="suspectDesc" placeholder="Deskripsi" style="min-height: 40px;"></textarea>
                </div>

                <button class="btn-primary" onclick="addSuspect()">Catat Pencuri</button>

                <div class="id-list" id="logList" style="margin-top: 15px;">
                    <div class="no-data">Log kosong.</div>
                </div>
            </div>
        </div>

        <!-- BLACKLIST SECTION -->
        <div id="blacklist" class="section">
            <div class="content-box">
                <div class="section-title">Daftar Blacklist</div>
                
                <div class="input-group">
                    <input type="text" id="blacklistId" placeholder="ID untuk di-blacklist">
                </div>

                <div class="input-group">
                    <textarea id="blacklistReason" placeholder="Alasan" style="min-height: 40px;"></textarea>
                </div>

                <button class="btn-primary" onclick="addBlacklist()">Blacklist ID</button>

                <div class="id-list" id="blacklistList" style="margin-top: 15px;">
                    <div class="no-data">Tidak ada yang di-blacklist.</div>
                </div>
            </div>
        </div>
    </div>

    <script src="password-protection.js"></script>
    <script src="script.js"></script>
</body>
</html>
